<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aaivra Picks — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f7f5f0;
  --card:#ffffff;
  --text:#252525;
  --muted:#777;
  --border:#e6e1d8;
  --gold:#b28a45;
  --danger:#c94b4b;
  --success:#39845a;
  --dark:#252525;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  font-size:22px;
  font-weight:800;
}

.brand span{
  color:var(--gold);
}

.logout-btn{
  background:#252525;
  color:white;
  border:0;
  padding:10px 16px;
  border-radius:8px;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.login-box{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:30px;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.login-box h1{
  margin-top:0;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 12px;
  background:#fff;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--gold);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.primary-btn{
  width:100%;
  background:var(--dark);
  color:#fff;
  border:0;
  padding:12px;
  border-radius:9px;
  font-weight:700;
}

.secondary-btn{
  background:#f1eee7;
  color:#333;
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:8px;
}

.danger-btn{
  background:#fff0f0;
  color:var(--danger);
  border:1px solid #f0cccc;
  padding:8px 11px;
  border-radius:7px;
}

.success-btn{
  background:#edf8f1;
  color:var(--success);
  border:1px solid #cfe8d8;
  padding:8px 11px;
  border-radius:7px;
}

.dashboard{
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.stat-label{
  font-size:13px;
  color:var(--muted);
}

.stat-value{
  font-size:28px;
  font-weight:800;
  margin-top:5px;
}

.grid{
  display:grid;
  grid-template-columns:390px 1fr;
  gap:22px;
  align-items:start;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:20px;
}

.card h2{
  margin-top:0;
  font-size:19px;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:12px 0;
}

.checkbox-row input{
  width:auto;
}

.date-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.preview{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--border);
  margin-top:8px;
  display:none;
}

.toolbar{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

.product-count{
  color:var(--muted);
  font-size:13px;
  margin-bottom:12px;
}

.product-list{
  display:grid;
  gap:12px;
}

.product{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  display:grid;
  grid-template-columns:85px 1fr auto;
  gap:14px;
  align-items:center;
}

.product-img{
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:9px;
  background:#f2f2f2;
}

.product-name{
  font-weight:750;
  margin-bottom:5px;
}

.meta{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:7px;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:5px;
  font-size:10px;
  font-weight:700;
  background:#f0eee9;
}

.badge.active{
  background:#eaf7ef;
  color:#267344;
}

.badge.inactive{
  background:#f8eeee;
  color:#a94444;
}

.badge.highlight{
  background:#fbf1d8;
  color:#88651f;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.small-btn{
  border:1px solid var(--border);
  background:#fff;
  padding:7px 9px;
  border-radius:7px;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}

.error{
  color:var(--danger);
  font-size:13px;
  margin-top:10px;
}

.success{
  color:var(--success);
  font-size:13px;
  margin-top:10px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

@media(max-width:1100px){
  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }

  .toolbar{
    grid-template-columns:1fr 1fr 1fr;
  }
}

@media(max-width:700px){
  .container{
    padding:14px;
  }

  .topbar{
    padding:14px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .product{
    grid-template-columns:65px 1fr;
  }

  .product-img{
    width:65px;
    height:65px;
  }

  .actions{
    grid-column:1 / -1;
    justify-content:flex-start;
  }

  .date-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">Aaivra <span>Picks</span> — Admin</div>
  <button id="logoutBtn" class="logout-btn" style="display:none;">
    Logout
  </button>
</header>


<!-- LOGIN -->

<section id="loginSection" class="login-box">

  <h1>Admin Login</h1>
  <p style="color:#777;">
    Sign in to manage Aaivra Picks products.
  </p>

  <div class="form-group">
    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="Admin email">
  </div>

  <button id="loginBtn" class="primary-btn">

</button>

<button

  type="button"

    width:100%;
    margin-top:10px;
    background:none;
    border:0;
    color:#b28a45;
    font-weight:700;
    cursor:pointer;
  "
>
  Forgot Password?
</button>

<div id="loginMessage"></div>

</section>

<!-- PASSWORD RESET -->

<section
  id="resetSection"
  class="login-box"
  style="display:none;"
>

  <h1>Set New Password</h1>

  <p style="color:#777;">
    Enter your new Admin Panel password.
  </p>

  <div class="form-group">
    <label>New Password</label>
    <input
      id="newPassword"
      type="password"
      placeholder="Enter new password"
    >
  </div>

  <div class="form-group">
    <label>Confirm Password</label>
    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm new password"
    >
  </div>

  <button
    id="updatePasswordBtn"
    class="primary-btn"
  >
    Update Password
  </button>

  <div id="resetMessage"></div>

</section>
  
<!-- DASHBOARD -->

<main id="dashboard" class="dashboard">

<div class="container">

  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-label">Total Products</div>
      <div id="totalProducts" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Active</div>
      <div id="activeProducts" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Inactive</div>
      <div id="inactiveProducts" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Highlighted</div>
      <div id="highlightProducts" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Categories</div>
      <div id="categoryCount" class="stat-value">0</div>
    </div>

  </div>


  <div class="grid">

    <!-- PRODUCT FORM -->

    <section class="card">

      <div class="section-title">
        <h2 id="formTitle">Add Product</h2>
        <button id="cancelEdit" class="secondary-btn" style="display:none;">
          Cancel
        </button>
      </div>

      <input type="hidden" id="productId">

      <div class="form-group">
        <label>Product Name *</label>
        <input id="productName" type="text" placeholder="Product name">
      </div>

      <div class="form-group">
        <label>Main Category *</label>
        <select id="category">
          <option value="">Select Category</option>
        </select>
      </div>

      <div class="form-group">
        <label>Subcategory *</label>
        <select id="subcategory">
          <option value="">Select Subcategory</option>
        </select>
      </div>

      <div class="form-group">
        <label>Short Description</label>
        <textarea id="description" placeholder="Short product description"></textarea>
      </div>

      <div class="form-group">
        <label>Image URL *</label>
        <input id="imageUrl" type="url" placeholder="https://...">
        <img id="imagePreview" class="preview">
      </div>

      <div class="form-group">
        <label>Affiliate URL *</label>
        <input id="affiliateUrl" type="url" placeholder="https://...">
      </div>

      <div class="checkbox-row">
        <input id="active" type="checkbox" checked>
        <label for="active" style="margin:0;">
          Product Active
        </label>
      </div>

      <hr style="border:0;border-top:1px solid #eee;margin:20px 0;">

      <div class="checkbox-row">
        <input id="highlighted" type="checkbox">
        <label for="highlighted" style="margin:0;">
          Show in Highlights
        </label>
      </div>

      <div id="highlightDates" style="display:none;">

        <div class="date-grid">

          <div class="form-group">
            <label>Highlight Start Date</label>
            <input id="highlightStart" type="date">
          </div>

          <div class="form-group">
            <label>Highlight End Date</label>
            <input id="highlightEnd" type="date">
          </div>

        </div>

      </div>

      <button id="saveBtn" class="primary-btn">
        Add Product
      </button>

      <div id="formMessage"></div>

    </section>


    <!-- PRODUCT MANAGEMENT -->

    <section class="card">

      <div class="section-title">
        <h2>Product Management</h2>
        <button id="refreshBtn" class="secondary-btn">
          Refresh
        </button>
      </div>

      <div class="toolbar">

        <input
          id="searchInput"
          type="search"
          placeholder="🔎 Search products..."
        >

        <select id="filterCategory">
          <option value="">All Categories</option>
        </select>

        <select id="filterSubcategory">
          <option value="">All Subcategories</option>
        </select>

        <select id="filterStatus">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>

        <select id="sortProducts">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="az">A–Z</option>
          <option value="za">Z–A</option>
        </select>

      </div>

      <div class="toolbar" style="grid-template-columns:1fr;">

        <select id="filterHighlight">
          <option value="">All Products</option>
          <option value="highlight">Highlighted Only</option>
          <option value="normal">Normal Products</option>
        </select>

      </div>

      <div id="productCount" class="product-count">
        0 products
      </div>

      <div id="productList" class="product-list"></div>

    </section>

  </div>

</div>

</main>


<script>

const SUPABASE_URL =
  "https://tqdafchoiahfwofkgmwx.supabase.co";

/*
  IMPORTANT:
  Yahan apni Supabase PUBLISHABLE KEY paste karo.

  sb_publishable_... key use karo.
  NEVER use sb_secret_... key.
*/

const SUPABASE_KEY =
  "sb_publishable_97lkGMFrkcsJnM5XLaDJnQ_ohrWhsbe";


const { createClient } =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   CATEGORY STRUCTURE
========================= */

const CATEGORY_DATA = {

  "Home & Living": [
    "Home Decor",
    "Lighting",
    "Furniture",
    "Storage & Organization",
    "Kitchen & Dining",
    "Bathroom",
    "Home Office"
  ],

  "Fashion": [
    "T-Shirts",
    "Kurtis",
    "Dresses",
    "Tops",
    "Footwear",
    "Bags",
    "Jewellery & Accessories",
    "Watches",
    "Sunglasses"
  ],

  "Electronics & Gadgets": [
    "Smartwatches",
    "Mobile Accessories",
    "Audio",
    "Computer & Laptop Accessories",
    "Smart Home",
    "Other Gadgets"
  ],

  "Beauty & Personal Care": [
    "Skincare",
    "Hair Care",
    "Makeup",
    "Grooming",
    "Personal Care Accessories"
  ],

  "Kids": [
    "Toys",
    "Kids Clothing",
    "School & Stationery",
    "Baby Products",
    "Kids Learning"
  ],

  "Fitness & Sports": [
    "Fitness Equipment",
    "Yoga",
    "Sports Accessories",
    "Outdoor & Travel Fitness"
  ],

  "Travel & Lifestyle": [
    "Travel Bags",
    "Travel Accessories",
    "Everyday Carry",
    "Lifestyle Accessories"
  ],

  "Digital & Office": [
    "Stationery",
    "Desk Accessories",
    "Office Supplies",
    "Digital Products"
  ],

  "Gifts": [
    "Gifts for Her",
    "Gifts for Him",
    "Couple Gifts",
    "Personalized Gifts"
  ]

};


/* =========================
   STATE
========================= */

let products = [];
let editingId = null;


/* =========================
   DOM
========================= */

const loginSection =
  document.getElementById("loginSection");

const dashboard =
  document.getElementById("dashboard");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginBtn =
  document.getElementById("loginBtn");

const loginMessage =
  document.getElementById("loginMessage");


/* =========================
   CATEGORY OPTIONS
========================= */

function populateMainCategories(){

  const category =
    document.getElementById("category");

  const filterCategory =
    document.getElementById("filterCategory");

  category.innerHTML =
    `<option value="">Select Category</option>`;

  filterCategory.innerHTML =
    `<option value="">All Categories</option>`;

  Object.keys(CATEGORY_DATA).forEach(cat => {

    category.innerHTML +=
      `<option value="${escapeHtml(cat)}">
        ${escapeHtml(cat)}
      </option>`;

    filterCategory.innerHTML +=
      `<option value="${escapeHtml(cat)}">
        ${escapeHtml(cat)}
      </option>`;

  });

}


function populateSubcategories(
  categoryValue,
  targetId = "subcategory"
){

  const select =
    document.getElementById(targetId);

  const list =
    CATEGORY_DATA[categoryValue] || [];

  if(targetId === "subcategory"){

    select.innerHTML =
      `<option value="">Select Subcategory</option>`;

  }else{

    select.innerHTML =
      `<option value="">All Subcategories</option>`;

  }

  list.forEach(sub => {

    select.innerHTML +=
      `<option value="${escapeHtml(sub)}">
        ${escapeHtml(sub)}
      </option>`;

  });

}


/* =========================
   AUTH
========================= */

loginBtn.addEventListener("click", login);

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  loginMessage.className = "";

  if(!email || !password){

    loginMessage.className = "error";
    loginMessage.textContent =
      "Email and password required.";

    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  const { error } =
    await supabase.auth.signInWithPassword({
      email,
      password
    });

  loginBtn.disabled = false;
  loginBtn.textContent = "Login";

  if(error){

    loginMessage.className = "error";
    loginMessage.textContent =
      error.message;

    return;
  }

  loginMessage.className = "success";
  loginMessage.textContent =
    "Login successful.";

  showDashboard();

}


/* =========================
   PASSWORD RESET
========================= */

document.getElementById("forgotPasswordBtn")
  .addEventListener("click", async () => {

    const email = prompt("Enter your admin email:");

    if(!email || !email.trim()) return;

    const btn = document.getElementById("forgotPasswordBtn");
    btn.disabled = true;

    const redirectTo = window.location.href.split("#")[0];

    const { error } = await supabase.auth.resetPasswordForEmail(
      email.trim(),
      { redirectTo }
    );

    btn.disabled = false;

    if(error){
      loginMessage.className = "error";
      loginMessage.textContent = error.message;
      return;
    }

    loginMessage.className = "success";
    loginMessage.textContent =
      "Password reset link sent. Check your email.";
  });


document.getElementById("updatePasswordBtn")
  .addEventListener("click", async () => {

    const newPassword =
      document.getElementById("newPassword").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const message =
      document.getElementById("resetMessage");

    if(!newPassword || newPassword.length < 6){
      message.className = "error";
      message.textContent = "Password must be at least 6 characters.";
      return;
    }

    if(newPassword !== confirmPassword){
      message.className = "error";
      message.textContent = "Passwords do not match.";
      return;
    }

    const btn = document.getElementById("updatePasswordBtn");
    btn.disabled = true;
    btn.textContent = "Updating...";

    const { error } = await supabase.auth.updateUser({
      password: newPassword
    });

    btn.disabled = false;
    btn.textContent = "Update Password";

    if(error){
      message.className = "error";
      message.textContent = error.message;
      return;
    }

    message.className = "success";
    message.textContent = "Password updated successfully.";

    setTimeout(() => {
      window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
      document.getElementById("resetSection").style.display = "none";
      showDashboard();
    }, 700);
  });


supabase.auth.onAuthStateChange((event) => {
  if(event === "PASSWORD_RECOVERY"){
    loginSection.style.display = "none";
    dashboard.style.display = "none";
    logoutBtn.style.display = "none";
    document.getElementById("resetSection").style.display = "block";
  }
});


async function checkSession(){

  const {
    data:{
      session
    }
  } = await supabase.auth.getSession();

  if(session){

    showDashboard();

  }else{

    showLogin();

  }

}


function showLogin(){

  loginSection.style.display = "block";
  dashboard.style.display = "none";
  logoutBtn.style.display = "none";

}


function showDashboard(){

  loginSection.style.display = "none";
  dashboard.style.display = "block";
  logoutBtn.style.display = "block";

  loadProducts();

}


logoutBtn.addEventListener("click", async () => {

  await supabase.auth.signOut();

  showLogin();

});


/* =========================
   FORM EVENTS
========================= */

document
  .getElementById("category")
  .addEventListener("change", e => {

    populateSubcategories(e.target.value);

  });


document
  .getElementById("filterCategory")
  .addEventListener("change", e => {

    populateSubcategories(
      e.target.value,
      "filterSubcategory"
    );

    renderProducts();

  });


document
  .getElementById("filterSubcategory")
  .addEventListener(
    "change",
    renderProducts
  );


document
  .getElementById("filterStatus")
  .addEventListener(
    "change",
    renderProducts
  );


document
  .getElementById("filterHighlight")
  .addEventListener(
    "change",
    renderProducts
  );


document
  .getElementById("sortProducts")
  .addEventListener(
    "change",
    renderProducts
  );


document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderProducts
  );


document
  .getElementById("highlighted")
  .addEventListener("change", e => {

    document.getElementById("highlightDates")
      .style.display =
      e.target.checked
      ? "block"
      : "none";

  });


document
  .getElementById("imageUrl")
  .addEventListener("input", e => {

    const preview =
      document.getElementById("imagePreview");

    if(e.target.value.trim()){

      preview.src =
        e.target.value.trim();

      preview.style.display =
        "block";

    }else{

      preview.style.display =
        "none";

    }

  });


document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    saveProduct
  );


document
  .getElementById("cancelEdit")
  .addEventListener(
    "click",
    resetForm
  );


document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    loadProducts
  );


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const {
    data,
    error
  } = await supabase
    .from("products")
    .select("*")
    .order(
      "created_at",
      { ascending:false }
    );

  if(error){

    alert(
      "Products load failed: " +
      error.message
    );

    return;
  }

  products = data || [];

  updateStats();
  renderProducts();

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

  const name =
    document
      .getElementById("productName")
      .value.trim();

  const category =
    document
      .getElementById("category")
      .value;

  const subcategory =
    document
      .getElementById("subcategory")
      .value;

  const description =
    document
      .getElementById("description")
      .value.trim();

  const image_url =
    document
      .getElementById("imageUrl")
      .value.trim();

  const affiliate_url =
    document
      .getElementById("affiliateUrl")
      .value.trim();

  const active =
    document
      .getElementById("active")
      .checked;

  const is_highlighted =
    document
      .getElementById("highlighted")
      .checked;

  const highlight_start =
    document
      .getElementById("highlightStart")
      .value || null;

  const highlight_end =
    document
      .getElementById("highlightEnd")
      .value || null;


  if(!name ||
     !category ||
     !subcategory ||
     !image_url ||
     !affiliate_url){

    showFormMessage(
      "Please fill all required fields.",
      "error"
    );

    return;
  }


  if(is_highlighted){

    if(!highlight_start ||
       !highlight_end){

      showFormMessage(
        "Highlight start and end dates are required.",
        "error"
      );

      return;
    }

    if(highlight_start > highlight_end){

      showFormMessage(
        "Start date cannot be after end date.",
        "error"
      );

      return;
    }

  }


  const payload = {

    name,
    category,
    subcategory,
    description,
    image_url,
    affiliate_url,
    active,
    is_highlighted,

    highlight_start:
      is_highlighted
      ? highlight_start
      : null,

    highlight_end:
      is_highlighted
      ? highlight_end
      : null,

    updated_at:
      new Date().toISOString()

  };


  const saveBtn =
    document.getElementById("saveBtn");

  saveBtn.disabled = true;
  saveBtn.textContent =
    editingId
    ? "Updating..."
    : "Adding...";


  let result;


  if(editingId){

    result =
      await supabase
        .from("products")
        .update(payload)
        .eq("id", editingId);

  }else{

    result =
      await supabase
        .from("products")
        .insert(payload);

  }


  saveBtn.disabled = false;

  saveBtn.textContent =
    editingId
    ? "Update Product"
    : "Add Product";


  if(result.error){

    showFormMessage(
      result.error.message,
      "error"
    );

    return;
  }


  showFormMessage(
    editingId
    ? "Product updated successfully."
    : "Product added successfully.",
    "success"
  );


  resetForm();
  loadProducts();

}


/* =========================
   EDIT
========================= */

function editProduct(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );

  if(!product) return;

  editingId = product.id;

  document
    .getElementById("formTitle")
    .textContent =
    "Edit Product";

  document
    .getElementById("saveBtn")
    .textContent =
    "Update Product";

  document
    .getElementById("cancelEdit")
    .style.display =
    "block";


  document
    .getElementById("productName")
    .value =
    product.name || "";

  document
    .getElementById("category")
    .value =
    product.category || "";

  populateSubcategories(
    product.category || ""
  );

  document
    .getElementById("subcategory")
    .value =
    product.subcategory || "";

  document
    .getElementById("description")
    .value =
    product.description || "";

  document
    .getElementById("imageUrl")
    .value =
    product.image_url || "";

  document
    .getElementById("affiliateUrl")
    .value =
    product.affiliate_url || "";

  document
    .getElementById("active")
    .checked =
    product.active !== false;

  document
    .getElementById("highlighted")
    .checked =
    product.is_highlighted === true;

  document
    .getElementById("highlightStart")
    .value =
    product.highlight_start || "";

  document
    .getElementById("highlightEnd")
    .value =
    product.highlight_end || "";

  document
    .getElementById("highlightDates")
    .style.display =
    product.is_highlighted
    ? "block"
    : "none";


  const preview =
    document.getElementById("imagePreview");

  if(product.image_url){

    preview.src =
      product.image_url;

    preview.style.display =
      "block";

  }else{

    preview.style.display =
      "none";

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DELETE
========================= */

async function deleteProduct(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );

  if(!product) return;


  const confirmed =
    confirm(
      `Delete "${product.name}"?`
    );

  if(!confirmed) return;


  const {
    error
  } = await supabase
    .from("products")
    .delete()
    .eq("id", id);


  if(error){

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  loadProducts();

}


/* =========================
   TOGGLE ACTIVE
========================= */

async function toggleActive(
  id,
  currentStatus
){

  const {
    error
  } = await supabase
    .from("products")
    .update({
      active:!currentStatus,
      updated_at:
        new Date().toISOString()
    })
    .eq("id", id);


  if(error){

    alert(
      "Status update failed: " +
      error.message
    );

    return;
  }


  loadProducts();

}

/* =========================
   FILTER + SEARCH
========================= */

function renderProducts(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const category =
    document
      .getElementById("filterCategory")
      .value;

  const subcategory =
    document
      .getElementById("filterSubcategory")
      .value;

  const status =
    document
      .getElementById("filterStatus")
      .value;

  const highlight =
    document
      .getElementById("filterHighlight")
      .value;

  const sort =
    document
      .getElementById("sortProducts")
      .value;


  let filtered =
    [...products];


  /* SEARCH */

  if(search){

    filtered =
      filtered.filter(p =>

        (p.name || "")
          .toLowerCase()
          .includes(search)

        ||

        (p.description || "")
          .toLowerCase()
          .includes(search)

        ||

        (p.category || "")
          .toLowerCase()
          .includes(search)

        ||

        (p.subcategory || "")
          .toLowerCase()
          .includes(search)

      );

  }


  /* CATEGORY */

  if(category){

    filtered =
      filtered.filter(
        p => p.category === category
      );

  }


  /* SUBCATEGORY */

  if(subcategory){

    filtered =
      filtered.filter(
        p => p.subcategory === subcategory
      );

  }


  /* STATUS */

  if(status === "active"){

    filtered =
      filtered.filter(
        p => p.active === true
      );

  }

  if(status === "inactive"){

    filtered =
      filtered.filter(
        p => p.active === false
      );

  }


  /* HIGHLIGHT */

  if(highlight === "highlight"){

    filtered =
      filtered.filter(
        p => p.is_highlighted === true
      );

  }

  if(highlight === "normal"){

    filtered =
      filtered.filter(
        p => p.is_highlighted !== true
      );

  }


  /* SORT */

  if(sort === "newest"){

    filtered.sort(
      (a,b) =>
        new Date(b.created_at) -
        new Date(a.created_at)
    );

  }

  if(sort === "oldest"){

    filtered.sort(
      (a,b) =>
        new Date(a.created_at) -
        new Date(b.created_at)
    );

  }

  if(sort === "az"){

    filtered.sort(
      (a,b) =>
        (a.name || "")
          .localeCompare(
            b.name || ""
          )
    );

  }

  if(sort === "za"){

    filtered.sort(
      (a,b) =>
        (b.name || "")
          .localeCompare(
            a.name || ""
          )
    );

  }


  document
    .getElementById("productCount")
    .textContent =
    `${filtered.length} product${
      filtered.length === 1
      ? ""
      : "s"
    }`;


  const list =
    document.getElementById(
      "productList"
    );


  if(!filtered.length){

    list.innerHTML =
      `<div class="empty">
        No products found.
      </div>`;

    return;
  }


  list.innerHTML =
    filtered
      .map(productCard)
      .join("");

}


/* =========================
   PRODUCT CARD
========================= */

function productCard(p){

  const activeBadge =
    p.active
    ? `<span class="badge active">Active</span>`
    : `<span class="badge inactive">Inactive</span>`;


  const highlightBadge =
    p.is_highlighted
    ? `<span class="badge highlight">
        ⭐ Highlighted
      </span>`
    : "";


  const dates =
    p.is_highlighted &&
    p.highlight_start &&
    p.highlight_end

    ? `<div class="meta">
        ${p.highlight_start}
        →
        ${p.highlight_end}
      </div>`

    : "";


  return `

    <article class="product">

      <img
        class="product-img"
        src="${escapeAttribute(
          p.image_url || ""
        )}"
        alt="${escapeAttribute(
          p.name || ""
        )}"
        onerror="this.style.opacity='.3'"
      >

      <div>

        <div class="product-name">
          ${escapeHtml(
            p.name || "Untitled"
          )}
        </div>

        <div class="meta">
          ${escapeHtml(
            p.category || "No category"
          )}
          →
          ${escapeHtml(
            p.subcategory || "No subcategory"
          )}
        </div>

        <div class="badges">
          ${activeBadge}
          ${highlightBadge}
        </div>

        ${dates}

      </div>

      <div class="actions">

        <button
          class="small-btn"
          onclick="editProduct('${p.id}')"
        >
          Edit
        </button>

        <button
          class="small-btn"
          onclick="toggleActive(
            '${p.id}',
            ${p.active ? "true" : "false"}
          )"
        >
          ${p.active
            ? "Disable"
            : "Enable"}
        </button>

        <button
          class="danger-btn"
          onclick="deleteProduct('${p.id}')"
        >
          Delete
        </button>

      </div>

    </article>

  `;

}


/* =========================
   STATS
========================= */

function updateStats(){

  const total =
    products.length;

  const active =
    products.filter(
      p => p.active === true
    ).length;

  const inactive =
    total - active;

  const highlighted =
    products.filter(
      p => p.is_highlighted === true
    ).length;

  const categories =
    new Set(
      products
        .map(p => p.category)
        .filter(Boolean)
    ).size;


  document
    .getElementById("totalProducts")
    .textContent = total;

  document
    .getElementById("activeProducts")
    .textContent = active;

  document
    .getElementById("inactiveProducts")
    .textContent = inactive;

  document
    .getElementById("highlightProducts")
    .textContent = highlighted;

  document
    .getElementById("categoryCount")
    .textContent = categories;

}


/* =========================
   HELPERS
========================= */

function showFormMessage(
  message,
  type
){

  const el =
    document.getElementById(
      "formMessage"
    );

  el.className =
    type === "error"
    ? "error"
    : "success";

  el.textContent =
    message;

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return escapeHtml(value);

}


function getElementByIdSafe(id){

  return document.getElementById(id);

}
